[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brest-st"
version = "0.1.0"
description = "Unified graph learning for bulk RNA and spatial transcriptomics prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.3",
  "torch-geometric>=2.5",
]

[project.optional-dependencies]
training = [
  "pandas>=2.0",
  "pyarrow>=14.0",
]
demo = [
  "ipykernel>=6.25",
  "jupyterlab>=4.0",
  "matplotlib>=3.8",
  "nbclient>=0.10",
  "nbconvert>=7.10",
  "nbformat>=5.9",
  "pandas>=2.0",
]
preprocessing = [
  "h5py>=3.10",
  "openslide-python>=1.3",
  "pandas>=2.0",
  "pillow>=10.0",
  "pyarrow>=14.0",
  "scanpy>=1.10",
  "shapely>=2.0",
  "timm>=1.0",
]

[tool.setuptools.packages.find]
include = ["brest*"]
